# Datasource — Dev Services auto-starts PostgreSQL
quarkus.datasource.db-kind=postgresql
# Flyway
quarkus.flyway.migrate-at-start=false
# Logging — global level
quarkus.log.level=${LOG_LEVEL:INFO}

# Logging — app level (our code only)
quarkus.log.category."dev.learning".level=${APP_LEVEL:DEBUG}
quarkus.log.category."dev.learning".min-level=TRACE

# Hibernate
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%prod.quarkus.hibernate-orm.schema-management.strategy=none

