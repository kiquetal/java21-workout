# ── Test profile — overrides src/main/resources/application.properties ──

# Same base path as main so REST-assured URLs match
quarkus.http.root-path=/chiron

# ── Dev Services (test container) ──
# Quarkus auto-starts a PostgreSQL container for tests.
# These settings control THAT container, not your real DB.
quarkus.datasource.db-kind=postgresql
quarkus.devservices.enabled=true
quarkus.datasource.devservices.image-name=postgres:17
quarkus.datasource.devservices.db-name=book_lending_test
quarkus.datasource.devservices.username=test
quarkus.datasource.devservices.password=test

# ── Hibernate ──
# drop-and-create = clean schema every test run, no leftover data
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
# Show SQL in test output for debugging
quarkus.hibernate-orm.log.sql=true

# ── Flyway ──
# Off for tests — Hibernate manages the schema via drop-and-create
quarkus.flyway.migrate-at-start=false

# ── Logging ──
quarkus.log.level=INFO
quarkus.log.category."dev.learning".level=DEBUG
